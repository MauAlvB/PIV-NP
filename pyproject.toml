[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pivnp"
version = "2.0.0"
description = "PIV-NP: tracking of numerical particles on PIVlab velocity fields (displacements, strains, moisture)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Núria M. Pinyol" },
    { name = "Mauricio Alvarado" },
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    # Reads the test photographs when the moisture is computed from them (MOISTER=2).
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
# Only to open/render the VTK files from Python (ParaView does not need it)
viz = ["pyvista"]

[project.scripts]
pivnp = "pivnp.cli:main"
pivnp-vtk = "pivnp.vtk_export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: slow tests (the full regression case)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
