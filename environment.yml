# Reproducible development environment.
#   conda env create -f environment.yml
#   conda activate pivnp
#   pip install -e .
name: pivnp
channels:
  - conda-forge
  - msys2
dependencies:
  - python=3.12
  - numpy>=1.24
  - numba>=0.58
  - pillow>=10.0
  - pytest
  - pytest-cov
  - ruff
  - git
  # Only to build the original Fortran code and regenerate the reference results
  # (tools/make_reference.py). On Linux/macOS use the system gfortran.
  - m2w64-gcc-fortran  # [win]
